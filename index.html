<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vestidor</title>
  <meta name="description" content="Tu armario digital: fotografía tu ropa, recorta el fondo y descubre qué combina.">
  <meta name="theme-color" content="#F2F3F5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15171C" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Vestidor">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Schibsted+Grotesk:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="view" class="view"></main>

  <nav class="tabbar" aria-label="Secciones">
    <div class="tabs">
      <a href="#armario" data-tab="armario">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M12 3v18M9.5 11v2M14.5 11v2"/></svg>
        <span>Armario</span>
      </a>
      <a href="#outfits" data-tab="outfits">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3 5 5l-2 5 3 1 1-3v13h10V8l1 3 3-1-2-5-3-2"/><path d="M9 3a3 3 0 0 0 6 0"/></svg>
        <span>Probador</span>
      </a>
      <a href="#ajustes" data-tab="ajustes">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
        <span>Ajustes</span>
      </a>
    </div>
    <button class="tab-add" data-action="start-add" aria-label="Añadir prenda">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </nav>

  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <input type="file" id="file-camera" accept="image/*" capture="environment" hidden>
  <input type="file" id="file-library" accept="image/*" multiple hidden>
  <input type="file" id="file-import" accept="application/json,.json" hidden>

  <noscript>Vestidor necesita JavaScript para funcionar.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
